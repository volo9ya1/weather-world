<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather World</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <canvas id="weather-canvas"></canvas>

  <div class="app-container">
    <!-- Переключатель языка -->
    <div class="lang-switcher">
      <select id="lang-select">
        <option value="ru">RU 🇷🇺</option>
        <option value="en">EN 🇬🇧</option>
        <option value="uz">UZ 🇺🇿</option>
      </select>
    </div>

    <!-- Поиск -->
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Введите город..." data-i18n-placeholder="searchPlaceholder">
      <button id="search-btn"><i class="fas fa-search"></i></button>
    </div>

    <!-- Карточка погоды -->
    <div class="weather-card">
      <div class="weather-header">
        <h1 id="city-name">Ташкент</h1>
        <p id="weather-desc">Загрузка...</p>
      </div>
      <div class="temperature-box">
        <span id="temp-value">+25</span><span class="deg">°C</span>
      </div>
      <div class="weather-details">
        <div class="detail-item">
          <i class="fas fa-tint"></i>
          <span data-i18n="humidityLabel">Влажность</span>
          <strong id="humidity">--%</strong>
        </div>
        <div class="detail-item">
          <i class="fas fa-wind"></i>
          <span data-i18n="windLabel">Ветер</span>
          <strong id="wind-speed">-- м/с</strong>
        </div>
        <div class="detail-item">
          <i class="fas fa-compress-arrows-alt"></i>
          <span data-i18n="pressureLabel">Давление</span>
          <strong id="pressure">-- мм</strong>
        </div>
      </div>
    </div>

    <!-- Рекомендации -->
    <div class="recommendations">
      <h2 data-i18n="recTitle">💡 Советы на сегодня</h2>
      <div class="rec-grid">
        <div class="rec-card">
          <div class="rec-icon">👕</div>
          <div>
            <h4 data-i18n="clothesTitle">Что надеть?</h4>
            <p id="rec-clothes">Загрузка...</p>
          </div>
        </div>
        <div class="rec-card">
          <div class="rec-icon">🚶‍♂️</div>
          <div>
            <h4 data-i18n="walkTitle">Идти ли гулять?</h4>
            <p id="rec-walk">Загрузка...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
